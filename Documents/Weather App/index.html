<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Easy Tutorials</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button><img src="images/search.png" alt="Search"></button>
        </div>

        <div class="weather">
            <img src="images/rain.png" class="weather-icon" alt="Weather icon">
            <h1 class="temp">32°C</h1>
            <h2 class="city">New York</h2>

            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="Humidity">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <img src="images/wind.png" alt="Wind">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "580d7793dd62885cb275b7ef3429deba";
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");
        const weatherIcon = document.querySelector(".weather-icon");

        async function checkWeather(city) {
            const response = await fetch(`${apiUrl}${city}&appid=${apiKey}`);

            if (!response.ok) {
                alert("City not found");
                return;
            }

            const data = await response.json();

            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".temp").innerHTML = `${Math.round(data.main.temp)}°C`;
            document.querySelector(".humidity").innerHTML = `${data.main.humidity}%`;
            document.querySelector(".wind").innerHTML = `${Math.round(data.wind.speed)} km/h`;

            const weatherMain = data.weather[0].main.toLowerCase();
            if (weatherMain === "clouds") weatherIcon.src = "images/clouds.png";
            else if (weatherMain === "clear") weatherIcon.src = "images/clear.png";
            else if (weatherMain === "rain") weatherIcon.src = "images/rain.png";
            else if (weatherMain === "drizzle") weatherIcon.src = "images/drizzle.png";
            else if (weatherMain === "mist") weatherIcon.src = "images/mist.png";
            else if (weatherMain === "snow") weatherIcon.src = "images/snow.png";
        }

        searchBtn.addEventListener("click", () => {
            checkWeather(searchBox.value.trim() || "abuja");
        });

        checkWeather("abuja");
    </script>
</body>
</html>
